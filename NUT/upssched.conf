# NUT upssched configuration for /etc/nut/upssched.sh
CMDSCRIPT "/etc/nut/upssched.sh"
PIPEFN    /var/run/nut/upssched.pipe
LOCKFN    /var/run/nut/upssched.lock

# 通信及维护通知
AT NOCOMM   * EXECUTE NOTIFY-NOCOMM
AT COMMBAD  * START-TIMER NOTIFY-COMMBAD 30
AT COMMOK   * CANCEL-TIMER NOTIFY-COMMBAD COMMOK
AT REPLBATT * EXECUTE NOTIFY-REPLBATT

# 断电后立即请求 VM 优雅关机；持续断电 60 秒后强停残留 VM 并触发 FSD。
AT ONBATT   * EXECUTE NOTIFY-ONBATT
AT ONBATT   * START-TIMER FORCE-FSD 60

# 市电在 60 秒内恢复时取消最终 FSD，并只恢复本次关闭的 VM。
AT ONLINE   * CANCEL-TIMER FORCE-FSD
AT ONLINE   * EXECUTE NOTIFY-ONLINE

# 低电量不再等待定时器。
AT LOWBATT  * EXECUTE NOTIFY-LOWBATT

# 原生 FSD/SHUTDOWN 事件仅用于记录；实际系统关机由 upsmon 负责。
AT FSD      * EXECUTE NOTIFY-FSD
AT SHUTDOWN * EXECUTE NOTIFY-SHUTDOWN